name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # No job-level `services:` block here deliberately — docker-compose (below) runs its
    # own `postgres` service on the same host port (5432); a GitHub-Actions-managed
    # services: postgres container would fight it for that port and fail the job before
    # a single test runs.
    steps:
      - uses: actions/checkout@v4

      - name: Create .env and app/config.py from examples
        # .env is gitignored (real secrets never committed) — a fresh checkout has no
        # such file, and docker-compose's `env_file: .env` on api/worker fails outright
        # without one. The test suite needs no real Groq/Deepgram keys: every test that
        # touches those providers monkeypatches the client (grep this repo's tests for
        # `monkeypatch.setattr(asv, "groq_client", ...)` for the established pattern).
        #
        # app/config.py is ALSO gitignored, and the Dockerfile's own self-heal step
        # (`test -f app/config.py || cp app/config.example.py app/config.py`) only
        # helps at build time — docker-compose's dev volume mount (`./app:/app/app`)
        # then overlays the container's /app/app with this checkout at runtime,
        # hiding whatever the image baked in. Without this file existing here too,
        # `import app.config` fails at collection for every test (confirmed: this
        # exact ModuleNotFoundError broke the first real CI run).
        run: |
          cp .env.example .env
          cp app/config.example.py app/config.py

      - name: Build API and agent images
        # Built the same way this project's own dev/deploy workflow builds them
        # (`docker compose up -d --build`, per CLAUDE.md) — a separately-tagged
        # docker/build-push-action build would sit under different image names/tags
        # than docker-compose's own naming and never actually get used by `up` below,
        # wasting the build for nothing.
        run: docker compose build api agent

      - name: Start services
        run: |
          docker compose up -d postgres api agent
          docker compose exec -T postgres pg_isready -U interview -t 30

      - name: Run unit tests
        run: |
          docker compose exec -T api pytest tests/unit -q --tb=short

      - name: Run integration tests
        run: |
          docker compose exec -T api pytest tests/integration -q --tb=short

      - name: Verify agent module syntax
        run: |
          docker compose exec -T agent python3 -m py_compile app/agent/pipeline.py app/agent/tools.py

      - name: Verify worker module syntax
        run: |
          docker compose exec -T api python3 -m py_compile app/worker/grading_worker.py

      - name: Collect test results
        if: always()
        run: |
          docker compose logs api > /tmp/api.log || true
          docker compose logs postgres > /tmp/postgres.log || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: /tmp/*.log
