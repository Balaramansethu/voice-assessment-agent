# Production stack for the OCI box: real phone calls via Twilio, HTTPS via Caddy.
#
#   Caller → Twilio number → HTTPS webhook (Caddy :443) → agent :7860 (TwiML)
#         → Twilio Media Stream (WSS) → Caddy → agent → Pipecat (Groq STT/LLM,
#           Kokoro TTS) over 8kHz mu-law.
#
# Bring up:  docker compose -f docker-compose.prod.yml up -d --build
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_ENV: production
    volumes:
      - ./data:/app/data          # KB + question banks for seeding
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ["python3", "-m", "app.worker.grading_worker"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    env_file: .env
    environment:
      API_BASE: http://api:8000
    # Twilio telephony mode; -x is the public host used to build the WSS stream URL.
    # The public webhook is guarded by Twilio signature validation (api service),
    # which is the primary access control for the phone path.
    command: ["python", "-m", "app.agent.pipeline", "-t", "twilio",
              "-x", "${PUBLIC_HOST}", "--host", "0.0.0.0"]
    volumes:
      - kokoro_models:/root/.cache
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    depends_on:
      - agent
      - api
    restart: unless-stopped

volumes:
  pgdata:
  kokoro_models:
  caddy_data:
  caddy_config:
